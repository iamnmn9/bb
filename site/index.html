<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baby Pundir's Neverland</title>
  <meta name="description" content="You're invited to Baby Pundir's Peter Pan baby shower. Second star to the right, and straight on till morning.">

  <!-- Link previews (WhatsApp, iMessage, etc.) -->
  <meta property="og:title" content="Baby Pundir's Neverland ✨">
  <meta property="og:description" content="You're invited to a Peter Pan baby shower. Follow Tinker Bell to Neverland!">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0b1033">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Night sky: stars are drawn on this canvas -->
  <canvas id="sky" aria-hidden="true"></canvas>

  <!-- The second star to the right -->
  <div class="second-star" aria-hidden="true"></div>

  <div class="moon" aria-hidden="true"></div>

  <!-- London skyline silhouette with Big Ben -->
  <svg class="skyline" viewBox="0 0 1200 220" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <path d="M0 220V190H40V178H70V196H95V169H130V187H150V172H190V193H220V160H240V148H260V160H280V184H330V172H380V187H420V172H455V130L470 104L485 130V172H520V178H560V154H580V145H600V154H620V181H660V169H700V187H740V163H780V184H820V172H860V151H910V178H940V166H980V187H1020V160H1060V181H1100V169H1140V184H1170V175H1200V220Z"/>
    <!-- Big Ben clock face -->
    <circle cx="470" cy="141" r="6" class="clock"/>
  </svg>

  <!-- Pixie dust trail -->
  <canvas id="dust" aria-hidden="true"></canvas>

  <!-- Tinker Bell (an original glowing fairy drawing) -->
  <div id="tink" class="tink" aria-hidden="true">
    <svg viewBox="0 0 80 80" width="110" height="110">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff8c9" stop-opacity=".95"/>
          <stop offset="40%" stop-color="#ffe066" stop-opacity=".45"/>
          <stop offset="100%" stop-color="#ffe066" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#e9fbff" stop-opacity=".9"/>
          <stop offset="100%" stop-color="#9fe3ff" stop-opacity=".35"/>
        </linearGradient>
      </defs>
      <circle cx="40" cy="40" r="38" fill="url(#glow)"/>
      <g class="wings">
        <ellipse class="wing wing-back" cx="30" cy="30" rx="15" ry="7" transform="rotate(-35 30 30)" fill="url(#wing)" stroke="#ffffff" stroke-opacity=".6" stroke-width=".6"/>
        <ellipse class="wing wing-front" cx="31" cy="42" rx="11" ry="5" transform="rotate(20 31 42)" fill="url(#wing)" stroke="#ffffff" stroke-opacity=".6" stroke-width=".6"/>
      </g>
      <!-- legs -->
      <path d="M42 50 L37 62 M44 50 L45 63" stroke="#f6d2b4" stroke-width="2" stroke-linecap="round"/>
      <!-- leaf dress -->
      <path d="M40 34 Q47 34 48 40 L52 51 Q46 49 44 52 Q41 48 37 51 Q38 44 40 34 Z" fill="#5fd068"/>
      <!-- arm reaching forward with wand -->
      <path d="M45 37 L55 32" stroke="#f6d2b4" stroke-width="2" stroke-linecap="round"/>
      <circle cx="57" cy="31" r="2.2" fill="#fffbe0"/>
      <!-- head + hair bun -->
      <circle cx="44" cy="28" r="5.2" fill="#f6d2b4"/>
      <path d="M39 27 Q40 21 45 22 Q49 23 49 27 Q46 24 41 26 Z" fill="#f7d35a"/>
      <circle cx="41" cy="21" r="3" fill="#f7d35a"/>
    </svg>
  </div>

  <main class="hero">
    <p class="kicker">Second star to the right, and straight on till morning</p>
    <h1>
      <span class="small">Welcome to</span>
      Baby Pundir's<br>Neverland
    </h1>
    <p class="lede">Think happy thoughts, sprinkle a little pixie dust, and come celebrate our littlest Lost Boy or Girl with us.</p>
    <a id="enter" class="enter" href="neverland.html">
      <span>Click here to enter Baby Pundir's Neverland</span>
    </a>
    <p class="hint">Psst… Tinker Bell follows you if you wave at her.</p>
  </main>

  <script src="assets/js/sky.js"></script>
  <script src="assets/js/tinkerbell.js"></script>
</body>
</html>
